<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de Verbos Regulares - Rompecabezas Interactivo</title>
  <style>
    :root {
      --table-bg: #3a5a40;
      --card-bg: #fdfbf7;
      --text-main: #1f2937;
      --yellow-piece: #facc15;
      --yellow-border: #eab308;
      --green-piece: #22c55e;
      --green-border: #15803d;
      --pronoun-color: #d9381e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--table-bg);
      min-height: 100vh;
      padding: 20px;
      color: var(--text-main);
    }

    h1 {
      text-align: center;
      color: #ffffff;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 1.8rem;
    }

    .subtitle {
      text-align: center;
      color: #dad7cd;
      margin-bottom: 20px;
      font-size: 1.05rem;
    }

    /* CONTENEDOR PRINCIPAL: MESA Y CONJUGACIÓN */
    .main-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1300px;
      margin: 0 auto;
    }

    /* MESA DE PAPELES DESPERDIGADOS */
    .desk-area {
      background-color: #a3b18a;
      border: 4px solid #588157;
      border-radius: 20px;
      padding: 20px;
      min-height: 550px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-content: flex-start;
      justify-content: center;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
    }

    .verb-card {
      background-color: #ffffff;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      color: #333;
      box-shadow: 3px 4px 8px rgba(0,0,0,0.15);
      cursor: pointer;
      user-select: none;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 1px solid #ddd;
    }

    .verb-card:hover {
      transform: scale(1.1) rotate(0deg) !important;
      z-index: 10;
      box-shadow: 5px 8px 15px rgba(0,0,0,0.25);
      background-color: #fef08a;
    }

    .verb-card.active {
      background-color: var(--yellow-piece);
      border: 2px solid var(--yellow-border);
      transform: scale(1.05) rotate(0deg) !important;
      z-index: 5;
    }

    /* ÁREA DE TRABAJO (CONJUGADOR) */
    .workspace {
      background-color: var(--card-bg);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      display: flex;
      flex-direction: column;
    }

    .verb-header {
      text-align: center;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e5e7eb;
    }

    .selected-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--text-main);
    }

    .stem-info {
      font-size: 1.1rem;
      color: #4b5563;
      margin-top: 4px;
    }

    .stem-highlight {
      background-color: var(--yellow-piece);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 800;
    }

    /* GRID DE FILAS DE CONJUGACIÓN */
    .conjugation-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: grid;
      grid-template-columns: 140px 1fr auto;
      align-items: center;
      gap: 10px;
      background-color: #ffffff;
      padding: 8px 15px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .pronoun {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--pronoun-color);
    }

    /* PUZZLE SVG */
    .puzzle-box {
      cursor: pointer;
    }

    .puzzle-svg {
      display: block;
      overflow: visible;
      filter: drop-shadow(0px 3px 4px rgba(0, 0, 0, 0.12));
    }

    .text-stem {
      fill: #1f2937;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 18px;
      dominant-baseline: central;
      text-anchor: middle;
    }

    .text-ending {
      fill: #ffffff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-weight: 900;
      font-size: 18px;
      dominant-baseline: central;
      text-anchor: middle;
      transition: opacity 0.25s ease;
    }

    .text-hidden {
      opacity: 0;
    }

    /* BOTÓN DE AUDIO */
    .audio-btn {
      background: #f3f4f6;
      border: 2px solid #e5e7eb;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
    }

    .audio-btn:hover {
      background-color: var(--yellow-piece);
      border-color: var(--yellow-border);
      transform: scale(1.1);
    }

    @media (max-width: 900px) {
      .main-layout { grid-template-columns: 1fr; }
      .desk-area { min-height: auto; }
    }
  </style>
</head>
<body>

  <h1>Mesa de Verbos Regulares</h1>
  <div class="subtitle">Haz clic en cualquier papel de la mesa para extraer su raíz y ver la conjugación</div>

  <div class="main-layout">
    
    <div class="desk-area" id="deskArea"></div>

    <div class="workspace">
      <div class="verb-header">
        <div class="selected-title" id="selectedVerbTitle">TOCAR</div>
        <div class="stem-info">Raíz extraída: <span class="stem-highlight" id="selectedStem">TOC-</span></div>
      </div>

      <div class="conjugation-grid" id="conjugationGrid"></div>
    </div>

  </div>

  <script>
    // Lista ampliada de verbos (incluye TOCAR y muchos otros de las imágenes y nuevos)
    const verbos = [
      { verbo: "TOCAR", tipo: "AR", raiz: "toc" },
      { verbo: "TRABAJAR", tipo: "AR", raiz: "trabaj" },
      { verbo: "ESTUDIAR", tipo: "AR", raiz: "estudi" },
      { verbo: "ENSEÑAR", tipo: "AR", raiz: "enseñ" },
      { verbo: "APRENDER", tipo: "ER", raiz: "aprend" },
      { verbo: "COMPRENDER", tipo: "ER", raiz: "comprend" },
      { verbo: "NECESITAR", tipo: "AR", raiz: "necesit" },
      { verbo: "BEBER", tipo: "ER", raiz: "beb" },
      { verbo: "TOMAR", tipo: "AR", raiz: "tom" },
      { verbo: "COMPRAR", tipo: "AR", raiz: "compr" },
      { verbo: "VENDER", tipo: "ER", raiz: "vend" },
      { verbo: "ESCRIBIR", tipo: "IR", raiz: "escrib" },
      { verbo: "ABRIR", tipo: "IR", raiz: "abr" },
      { verbo: "ROMPER", tipo: "ER", raiz: "romp" },
      { verbo: "DECIDIR", tipo: "IR", raiz: "decid" },
      { verbo: "OLVIDAR", tipo: "AR", raiz: "olvid" },
      { verbo: "AYUDAR", tipo: "AR", raiz: "ayud" },
      { verbo: "CANTAR", tipo: "AR", raiz: "cant" },
      { verbo: "BUSCAR", tipo: "AR", raiz: "busc" },
      { verbo: "DESAYUNAR", tipo: "AR", raiz: "desayun" },
      { verbo: "ESPERAR", tipo: "AR", raiz: "esper" },
      { verbo: "LLAMAR", tipo: "AR", raiz: "llam" },
      { verbo: "VIAJAR", tipo: "AR", raiz: "viaj" },
      { verbo: "BAILAR", tipo: "AR", raiz: "bail" },
      { verbo: "COCINAR", tipo: "AR", raiz: "cocin" },
      { verbo: "LEER", tipo: "ER", raiz: "le" },
      { verbo: "PARTIR", tipo: "IR", raiz: "part" },
      { verbo: "PAGAR", tipo: "AR", raiz: "pag" }
    ];

    const pronombres = ["Yo", "Tú", "Él / Ella / Usted", "Nosotros/as", "Vosotros/as", "Ellos / Ellas / Ustedes"];

    const terminaciones = {
      AR: ["-o", "-as", "-a", "-amos", "-áis", "-an"],
      ER: ["-o", "-es", "-e", "-emos", "-éis", "-en"],
      IR: ["-o", "-es", "-e", "-imos", "-ís", "-en"]
    };

    let selectedVerb = verbos[0];

    // Renderizar la mesa de papeles
    function renderDesk() {
      const desk = document.getElementById('deskArea');
      desk.innerHTML = '';

      verbos.forEach((v, index) => {
        const card = document.createElement('div');
        card.className = 'verb-card' + (v.verbo === selectedVerb.verbo ? ' active' : '');
        card.textContent = v.verbo;

        // Generar una rotación aleatoria simular la "mesa desperdigada"
        const randomRotation = (Math.random() * 20 - 10).toFixed(1); // entre -10deg y 10deg
        card.style.transform = `rotate(${randomRotation}deg)`;

        card.onclick = () => {
          selectedVerb = v;
          renderDesk();
          updateWorkspace();
        };

        desk.appendChild(card);
      });
    }

    // Actualizar el conjugador con el verbo elegido
    function updateWorkspace() {
      document.getElementById('selectedVerbTitle').textContent = `${selectedVerb.verbo} (-${selectedVerb.tipo})`;
      document.getElementById('selectedStem').textContent = `${selectedVerb.raiz.toUpperCase()}-`;

      const grid = document.getElementById('conjugationGrid');
      grid.innerHTML = '';

      pronombres.forEach((pronombre, i) => {
        const ending = terminaciones[selectedVerb.tipo][i];
        const fullWord = selectedVerb.raiz + ending.replace('-', '');

        const row = document.createElement('div');
        row.className = 'row';

        row.innerHTML = `
          <div class="pronoun">${pronombre}</div>
          <div class="puzzle-box" onclick="togglePiece(${i})">
            <svg class="puzzle-svg" width="240" height="48" viewBox="0 0 240 48">
              <path d="M 5,4 L 110,4 
                       C 110,13 123,13 123,4 
                       L 132,4 
                       A 4,4 0 0,1 136,8 
                       L 136,17 
                       C 146,17 146,30 136,30 
                       L 136,40 
                       A 4,4 0 0,1 132,44 
                       L 5,44 
                       A 4,4 0 0,1 1,40 
                       L 1,8 
                       A 4,4 0 0,1 5,4 Z" 
                    fill="#facc15" stroke="#eab308" stroke-width="2"/>
              <text x="60" y="24" class="text-stem">${selectedVerb.raiz}-</text>

              <path d="M 132,4 L 230,4 
                       A 4,4 0 0,1 234,8 
                       L 234,40 
                       A 4,4 0 0,1 230,44 
                       L 132,44 
                       A 4,4 0 0,1 128,40 
                       L 128,30 
                       C 138,30 138,17 128,17 
                       L 128,8 
                       A 4,4 0 0,1 132,4 Z" 
                    fill="#22c55e" stroke="#15803d" stroke-width="2"/>
              <text x="180" y="24" class="text-ending text-hidden" id="ending-${i}">${ending}</text>
            </svg>
          </div>
          <button class="audio-btn" title="Escuchar pronunciación" onclick="speak('${pronombre} ${fullWord}')">🔊</button>
        `;
        grid.appendChild(row);
      });
    }

    function togglePiece(index) {
      const endingText = document.getElementById(`ending-${index}`);
      if(endingText) endingText.classList.toggle('text-hidden');
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    // Inicializar
    renderDesk();
    updateWorkspace();
  </script>

</body>
</html>
